name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile production modules
        run: python -m py_compile app.py diadem_document_review.py diadem_feedback_rules.py retrieval_expansion.py

      - name: Run feedback regression tests
        run: python -m unittest -v test_diadem_feedback_rules.py
